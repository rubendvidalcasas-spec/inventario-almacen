<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de almacenes · Ubicaciones</title>
<style>
:root{--navy:#1F3A5F;--blue:#2E6FBF;--light:#EAF1FA;--gray:#5F6B7A;--line:#CBD5E1;--amber:#FAEEDA;--amberS:#BA7517;--ok:#E5F4E4;--empty:#F4F6F9}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1b2430;background:#fff}
header{background:var(--navy);color:#fff;padding:14px 16px}
header h1{margin:0;font-size:18px;font-weight:600}
header p{margin:2px 0 0;font-size:13px;opacity:.85}
main{max-width:1100px;margin:0 auto;padding:16px}
a{color:var(--blue)}
.crumbs{font-size:14px;margin-bottom:12px}
.status{font-size:12px;color:var(--gray);margin:0 0 12px}
.status.warn{color:#9a3412}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.card{display:block;border:1px solid var(--line);border-radius:12px;padding:14px;text-decoration:none;color:inherit;background:#fff}
.card h2{margin:0 0 4px;font-size:16px;color:var(--navy)}
.card p{margin:0;font-size:13px;color:var(--gray)}
.search{display:flex;gap:8px;margin:0 0 14px}
.search input{flex:1;padding:10px 12px;font-size:15px;border:1px solid var(--line);border-radius:8px}
.results{margin:0 0 16px;padding:0;list-style:none}
.results li{padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px}
.ficha{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:16px}
.ficha .top{background:var(--light);padding:14px 16px}
.ficha .code{font-size:13px;color:var(--gray);font-weight:600}
.ficha .big{font-size:34px;font-weight:700;color:var(--navy);line-height:1.1}
.ficha .where{font-size:14px;color:var(--gray);margin-top:4px}
.ficha .body{padding:14px 16px}
.ficha h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--gray);margin:0 0 6px}
.items{margin:0 0 14px;padding:0;list-style:none}
.items li{font-size:18px;font-weight:600;padding:8px 0;border-bottom:1px solid var(--line)}
.items li.none{color:var(--gray);font-weight:400;font-size:15px}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
dt{color:var(--gray)}dd{margin:0}
.scroll{overflow-x:auto;padding-bottom:6px}
.legend{font-size:12px;color:var(--gray);margin:8px 0 0}
.legend span{display:inline-block;width:12px;height:12px;border:1px solid #999;vertical-align:-2px;margin:0 4px 0 10px}
.pt{position:relative;min-width:900px;height:340px}
.blk{position:absolute;display:grid;border:2px solid #222;background:#222;gap:1px}
.blabel{position:absolute;font-size:12px;font-weight:600;color:var(--navy);text-align:center}
.cell{background:var(--empty);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2px;text-decoration:none;color:#1b2430;font-size:9.5px;line-height:1.15;overflow:hidden}
.cell b{font-size:12px;color:var(--navy)}
.cell span{font-size:8.5px;overflow-wrap:anywhere}
.cell.has{background:var(--ok)}
.cell.hl{background:var(--amber);outline:3px solid var(--amberS);outline-offset:-3px}
.aisle{position:absolute;left:0;right:0;top:150px;height:40px;border-top:2px dashed #E0B000;border-bottom:2px dashed #E0B000;font-size:12px;color:var(--gray);text-align:center;line-height:40px}
.door{position:absolute;bottom:0;border:2px solid #222;font-size:11px;font-weight:700;text-align:center;background:#fff}
.racks{display:flex;gap:22px;flex-wrap:wrap}
.rack h4{margin:0 0 6px;font-size:13px;color:var(--navy)}
.rack .cols{display:flex;gap:4px}
.col{display:flex;flex-direction:column;gap:2px;width:112px}
.col .h{font-size:12px;font-weight:600;text-align:center;color:var(--navy)}
.col .cell{height:78px;border:1px solid #888}
.pals{display:flex;gap:8px}
.pals .cell{width:92px;height:92px;border:2px solid #E0B000}
.rec{display:flex;gap:10px;flex-wrap:wrap}
.rec .isla{border:2px solid #222;display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#222;width:150px}
.rec .isla .cell{height:70px}
.ins{position:relative;width:100%;max-width:520px;border:3px solid #222;background:#fff}
.ins:before{content:"";display:block;padding-top:146.8%}
.ins .cell{position:absolute;border:2px solid #222}
.ins .wall{position:absolute;border:2px solid #555;background:repeating-linear-gradient(45deg,#eee 0 4px,#fff 4px 8px);font-size:11px;color:#555;display:flex;align-items:center;justify-content:center}
.ins .tag{position:absolute;font-size:11px;font-weight:700;color:#1F3A5F}
.free{position:relative;min-width:760px;border:3px solid #222;background:#fff}
.free .cell{position:absolute;border:1.5px solid #222}
.free .feat{position:absolute;border:1px solid #999;background:repeating-linear-gradient(45deg,#eee 0 4px,#fff 4px 8px);font-size:10px;color:#666;display:flex;align-items:center;justify-content:center}
.free .door{position:absolute;left:-3px;width:6px;background:#fff;border:0}
footer{font-size:12px;color:var(--gray);text-align:center;padding:18px}
</style>
</head>

function mapFree(key){ return function(box, hl){
  var f=SEED.ps[key]; var B=f.bounds, bw=B[2]-B[0], bh=B[3]-B[1];
  var wrap=el("div",{"class":"scroll"}); var c=el("div",{"class":"free"}); c.style.setProperty("--r",(bh/bw*100)+"%");
  c.style.paddingTop="0"; wrap.appendChild(c);
  var ratio=el("div"); ratio.style.paddingTop=(bh/bw*100)+"%"; c.appendChild(ratio);
  function pos(e,x0,y0,x1,y1){ e.style.left=((x0-B[0])/bw*100)+"%"; e.style.top=((y0-B[1])/bh*100)+"%"; e.style.width=((x1-x0)/bw*100)+"%"; e.style.height=((y1-y0)/bh*100)+"%"; }
  f.feat.forEach(function(x){ var d=el("div",{"class":"feat"},x[0]); pos(d,x[1],x[2],x[3],x[4]); c.appendChild(d); });
  if(f.stairs){ var st=el("div",{"class":"feat"},f.stairs_label||"Escalera → sube al 2.º piso"); pos(st,f.stairs[0],f.stairs[1],f.stairs[2],f.stairs[3]); st.style.background="repeating-linear-gradient(90deg,#fff 0 9px,#333 9px 10px)"; st.style.border="2px solid #222"; st.style.color="#111"; st.style.fontWeight="700"; st.style.textShadow="0 0 3px #fff,0 0 3px #fff,0 0 3px #fff"; st.style.justifyContent="flex-start"; st.style.paddingLeft="10px"; c.appendChild(st); }
  if(f.under){ var un=el("div",{"class":"feat"},f.under[0]); pos(un,f.under[1],f.under[2],f.under[3],f.under[4]); un.style.background="rgba(255,255,255,.85)"; un.style.border="2px dashed #2E6FBF"; un.style.color="#2E6FBF"; un.style.fontWeight="700"; un.style.textAlign="center"; c.appendChild(un); }
  f.locs.forEach(function(l){ var a=cellLink(f.pref+"-"+l[0], l[0], hl); pos(a,l[1],l[2],l[3],l[4]); c.appendChild(a); });
  var dr=f.door; if(dr){ var d=el("div",{"class":"door"}); d.style.top=((dr[1]-B[1])/bh*100)+"%"; d.style.height=((dr[3]-dr[1])/bh*100)+"%"; c.appendChild(d);
  var g=el("div",{"class":"tag"},"← Ingreso"); g.style.position="absolute"; g.style.left="4px"; g.style.top=((dr[1]-B[1])/bh*100)+"%"; g.style.fontSize="11px"; g.style.fontWeight="700"; g.style.color="#C2410C"; c.appendChild(g); }

var MAPS={PT:mapPT, ETQ:mapETQ, REC:mapREC, INS13:mapINS13, PS2:mapFree('PS2'), PS3:mapFree('PS3'), P11:mapFree('P11'), P15:mapFree('P15'), P21:mapFree('P21'), CU:mapFree('CU')};
function legend(box){ var p=el("p",{"class":"legend"}); p.appendChild(document.createTextNode("Colores:")); [["#E5F4E4","con ítems registrados"],["#F4F6F9","sin registro"],["#FAEEDA","ubicación escaneada"]].forEach(function(x){ var s=el("span"); s.style.background=x[0]; p.appendChild(s); p.appendChild(document.createTextNode(x[1])); }); box.appendChild(p); }

function zoneOf(code){ if(code.indexOf("P1-3-INS")===0) return "INS13"; if(code.indexOf("P3-2-")===0) return "PS2"; if(code.indexOf("P1-1-")===0) return "P11"; if(code.indexOf("P1-5-")===0) return "P15"; if(code.indexOf("P2-1-")===0) return "P21"; if(code.indexOf("P3-3-")===0) return "PS3"; return code.split("-")[2]; }
function almacen(id){ for(var i=0;i<ALMACENES.length;i++) if(ALMACENES[i].id===id) return ALMACENES[i]; return null; }

function searchBox(box){
  var f=el("form",{"class":"search"}); var inp=el("input",{type:"search",placeholder:"Buscar producto (ej. BOLI FM X50)","aria-label":"Buscar producto"}); f.appendChild(inp);
  var ul=el("ul",{"class":"results"});
  function run(){ var q=inp.value.trim().toUpperCase(); ul.textContent=""; if(q.length<2) return; var n=0;
    Object.keys(DATA).sort().forEach(function(k){ var r=DATA[k]; var txt=(items(r).join(" ")+" "+(r.Lote||"")).toUpperCase(); if(txt.indexOf(q)>=0 && n<50){ n++; var li=el("li"); var a=el("a",{href:"?u="+encodeURIComponent(k)},k); li.appendChild(a); li.appendChild(document.createTextNode(" — "+items(r).join(" · "))); ul.appendChild(li);} });
    if(!n) ul.appendChild(el("li",null,"Sin resultados")); }
  inp.addEventListener("input",run); f.addEventListener("submit",function(e){e.preventDefault();run();});
  box.appendChild(f); box.appendChild(ul);
}

function viewHome(app){
  crumbs([{t:"Inicio"}]);
  searchBox(app);
  var c=el("div",{"class":"cards"});
  ALMACENES.forEach(function(a){ var k=el("a",{"class":"card",href:"?a="+a.id}); k.appendChild(el("h2",null,a.nombre)); k.appendChild(el("p",null,a.lugar+" · "+a.desc)); c.appendChild(k); });
  app.appendChild(c);
}

function viewAlmacen(app,id,hl){
  var a=almacen(id); if(!a){ viewHome(app); return; }
  crumbs([{t:"Inicio",href:"?"},{t:a.nombre}]);
  document.getElementById("title").textContent=a.nombre; document.getElementById("subtitle").textContent=a.lugar+" · "+a.desc;
  searchBox(app); var box=el("div"); MAPS[id](box,hl); legend(box); app.appendChild(box);
}

function viewUbicacion(app,code){
  var r=DATA[code]; var z=zoneOf(code); var a=almacen(z);
  crumbs([{t:"Inicio",href:"?"},{t:a?a.nombre:"Almacén",href:a?"?a="+a.id:"?"},{t:code}]);
  var f=el("div",{"class":"ficha"}); var top=el("div",{"class":"top"});
  top.appendChild(el("div",{"class":"code"},code));
  top.appendChild(el("div",{"class":"big"},r? (r.Posicion||code) : code));
  top.appendChild(el("div",{"class":"where"}, r? [r.Almacen, r.Planta, "Piso "+r.Piso, r.Tipo].filter(Boolean).join(" · ") : "Ubicación no registrada en la hoja"));
  f.appendChild(top);
  var b=el("div",{"class":"body"}); b.appendChild(el("h3",null,"Qué contiene"));
  var ul=el("ul",{"class":"items"}); var its=items(r);
  if(its.length) its.forEach(function(t){ ul.appendChild(el("li",null,t)); }); else ul.appendChild(el("li",{"class":"none"},"Sin ítems registrados todavía"));
  b.appendChild(ul);
  var dl=el("dl"); [["Lote","Lote"],["Vencimiento","Vencimiento"],["Cantidad","Cantidad"],["Observaciones","Observaciones"],["Actualizado","Actualizado"]].forEach(function(p){ if(r && r[p[0]]){ dl.appendChild(el("dt",null,p[1])); dl.appendChild(el("dd",null,r[p[0]])); } });
  if(dl.childNodes.length) b.appendChild(dl);
  f.appendChild(b); app.appendChild(f);
  if(a){ document.getElementById("title").textContent=a.nombre; document.getElementById("subtitle").textContent=a.lugar;
    app.appendChild(el("h3",{style:"font-size:14px;color:#1F3A5F;margin:18px 0 8px"},"Dónde está en el almacén"));
    var box=el("div"); MAPS[a.id](box,code); legend(box); app.appendChild(box);
    var h=box.querySelector(".cell.hl"); var sc=box.querySelector(".scroll");
    if(h && sc){ sc.scrollLeft = Math.max(0, h.getBoundingClientRect().left - sc.getBoundingClientRect().left - sc.clientWidth/2 + h.offsetWidth/2); } }
}

function render(){
  var app=document.getElementById("app"); app.textContent=""; status();
  var p=params();
  if(p.u) viewUbicacion(app,p.u.trim().toUpperCase());
  else if(p.a) viewAlmacen(app,p.a.trim().toUpperCase(),null);
  else viewHome(app);
}

setData(SEED.rows);
loadSheet(function(){ render(); });
setInterval(function(){ var ae=document.activeElement; if(ae && ae.tagName==="INPUT") return; loadSheet(function(ok){ if(ok) render(); }); }, 60000);
